name: Keep HF Spaces Alive

on:
  schedule:
    # Cron pakai UTC. '0 3 * * *' = 03:00 UTC = 10:00 WIB tiap hari.
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  ping:
    name: Ping ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sppg-be
            url: https://sppg-be.booroong.online/keep-alive
          - name: booroong
            url: https://andreasmlbngaol-booroong.hf.space/swagger-ui.html
    steps:
      - name: Ping Space
        env:
          NAME: ${{ matrix.name }}
          URL: ${{ matrix.url }}
        run: |
          echo "Pinging $NAME -> $URL"
          code=$(curl -sS -L \
            --retry 5 --retry-delay 15 --retry-all-errors \
            --connect-timeout 30 --max-time 120 \
            -o /dev/null -w "%{http_code}" \
            "$URL")
          echo "HTTP status: $code"
          if [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then
            echo "✅ $NAME is awake (HTTP $code)"
          else
            echo "❌ $NAME returned HTTP $code"
            exit 1
          fi
